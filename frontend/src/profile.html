<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobOps Profile</title>
    <link rel="stylesheet" href="output.css">
    <link rel="icon" type="image/svg+xml" href="../assets/jobops-logo.svg">
</head>

<body>
    <!-- Logo + Navigation bar-->
    <header class="flex justify-between border-b-2 border-gray-300 w-[100%]">
        <a href="home.html" class="h-[10%] w-1/10"><img src="../assets/jobops-logo.svg" alt="JobOps Logo"> </a>
        <nav>
            <ul class="flex gap-10">
                <li class="p-2 m-2 text-lg hover:bg-gray-300 hover:rounded-md duration-400 cursor-pointer">
                    <a href="dashboard.html">Dashboard</a>
                </li>
                <li class="p-2 m-2 text-lg hover:bg-gray-300 hover:rounded-md duration-400 cursor-pointer"><a
                        href="Applications.html">Applications</a></li>
                <li class="p-2 m-2 text-lg hover:bg-gray-300 hover:rounded-md duration-400 cursor-pointer"><a
                        href="profile.html">Profile</a></li>
                <li class="p-2 m-2 text-lg hover:bg-gray-300 hover:rounded-md duration-400 cursor-pointer"><a
                        href="settings.html">Settings</a></li>
            </ul>
        </nav>
        <!--Profile image for more info-->
        <div>
            <button type="button" popovertarget="profile-list" aria-label="Open profile menu"
                class="cursor-pointer rounded-lg bg-gray-100 text-black transition-colors duration-200 hover:bg-gray-200">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="block h-10 w-10" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
            </button>
            <ul id="profile-list" popover
                class="fixed inset-auto right-6 top-[4.75rem] m-0 w-56 rounded-xl border border-gray-200 bg-white p-0 py-2 ">
                <li class="border-b border-gray-100 px-4 py-2">
                    <p class="text-sm font-semibold">Ahmed</p>
                    <p class="text-sm text-gray-500">ahmed@example.com</p>
                </li>
                <li><a href="#" class="block px-4 py-2 text-sm hover:bg-gray-100">My Profile</a></li>
                <li><a href="#" class="block px-4 py-2 text-sm hover:bg-gray-100">Settings</a></li>
                <li><a href="login.html" class="block px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Log out</a></li>
            </ul>
        </div>
    </header>

</body>

</html>
