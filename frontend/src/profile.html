<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobOps Profile</title>
    <link rel="stylesheet" href="output.css">
    <link rel="icon" type="image/svg+xml" href="../assets/jobops-logo.svg">
</head>

<body>
    <header class="flex justify-between border-b-2 border-gray-300">
        <a href="home.html"><img src="../assets/jobops-logo.svg" alt="JobOps Logo"> </a>
        <nav>
            <ul class="flex gap-10">
                <li class="p-2 bg-blue-400 rounded-lg m-2"><a href="dashboard.html">Dashboard</a></li>
                <li><a href="dashboard.html">Applications</a></li>
                <li><a href="dashboard.html">Profile</a></li>
                <li><a href="dashboard.html">Settings</a></li>
            </ul>
        </nav>
        <!--Profile image for more info-->
        <button type="button" popovertarget="profile-list" aria-label="Open profile menu"
            class="block h-10 w-10 mt-2 overflow-hidden rounded-full border border-gray-300 transition-all duration-200 hover:ring-2 hover:ring-gray-200">
            <img src="../assets/profile.jpg" alt="Your profile menu" class=" h-full w-full object-cover">
        </button>

        <ul id="profile-list" popover
            class="fixed inset-auto right-6 top-[4.25rem] m-0 w-56 rounded-xl border border-gray-200 bg-white p-0 py-2 shadow-lg">
            <li class="border-b border-gray-100 px-4 py-2">
                <p class="text-sm font-semibold">Ahmed</p>
                <p class="text-sm text-gray-500">ahmed@example.com</p>
            </li>
            <li><a href="#" class="block px-4 py-2 text-sm hover:bg-gray-100">My Profile</a></li>
            <li><a href="#" class="block px-4 py-2 text-sm hover:bg-gray-100">Settings</a></li>
            <li><a href="login.html" class="block px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Log out</a></li>
        </ul>
    </header>

</body>

</html>
