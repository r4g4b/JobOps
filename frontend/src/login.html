<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="./output.css" />
    <link rel="icon" type="image/svg+xml" href="../assets/jobops-logo.svg" />
  </head>

  <body class="flex min-h-screen flex-col bg-white text-gray-900 antialiased">
    <header class="border-b border-gray-200">
      <nav
        class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6"
      >
        <a href="home.html" class="flex items-center">
          <img
            src="../assets/jobops-logo.svg"
            alt="JobOps home"
            class="h-8 w-auto"
          />
        </a>
        <div class="flex items-center gap-4 text-sm">
          <a
            href="login.html"
            aria-current="page"
            class="font-medium text-[#1E5BB3] underline underline-offset-4"
            >Log in</a
          >
          <a
            href="register.html"
            class="rounded-md bg-[#1E5BB3] px-4 py-2 font-medium text-white duration-200 hover:bg-[#174a92]"
          >
            Get started
          </a>
        </div>
      </nav>
    </header>

    <main
      id="main"
      class="mx-auto grid w-full max-w-6xl flex-1 items-center gap-10 px-4 py-10 sm:px-6 md:grid-cols-2 md:gap-16"
    >
      <section aria-labelledby="welcome-title" class="order-2 md:order-1">
        <h1
          id="welcome-title"
          class="mt-3 text-3xl font-bold leading-tight sm:text-4xl"
        >
          Welcome back
        </h1>
        <ul class="mt-6 space-y-2 text-sm text-gray-700">
          <li>
            <span class="mr-2 text-[#1E5BB3]">-</span>One place for every
            opportunity
          </li>
          <li>
            <span class="mr-2 text-[#1E5BB3]">-</span>A clearer view of your
            progress
          </li>
          <li>
            <span class="mr-2 text-[#1E5BB3]">-</span>Your job search stays
            yours
          </li>
        </ul>
      </section>

      <section
        aria-labelledby="form-title"
        class="order-1 w-full max-w-md md:order-2 md:justify-self-end"
      >
        <div class="flex justify-center gap-5">
          <a
            href="#"
            title="Log in with Google"
            aria-label="Log in with Google"
            class="rounded-md border border-gray-300 p-2 duration-200 hover:bg-gray-100"
          >
            <img src="../assets/google.svg" alt="Google" class="block h-5" />
          </a>
          <a
            href="#"
            title="Log in with GitHub"
            aria-label="Log in with GitHub"
            class="rounded-md border border-gray-300 p-2 duration-200 hover:bg-gray-100"
          >
            <img
              src="../assets/github_light.svg"
              alt="GitHub"
              class="block h-5"
            />
          </a>
          <a
            href="#"
            title="Log in with LinkedIn"
            aria-label="Log in with LinkedIn"
            class="rounded-md border border-gray-300 p-2 duration-200 hover:bg-gray-100"
          >
            <img
              src="../assets/linkedin.svg"
              alt="LinkedIn"
              class="block h-5"
            />
          </a>
        </div>

        <div class="flex items-center gap-3 py-6 text-base text-gray-500">
          <hr class="flex-1 border-t border-gray-300" />
          <span>Or</span>
          <hr class="flex-1 border-t border-gray-300" />
        </div>

        <form method="post" class="space-y-4">
          <div>
            <label for="email" class="block text-sm font-medium"
              >Email address</label
            >
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              aria-describedby="email-hint"
              class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2.5 text-sm duration-200"
            />
          </div>

          <div>
            <label for="password" class="block text-sm font-medium"
              >Password</label
            >
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2.5 text-sm duration-200"
            />
          </div>

          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2">
              <input
                type="checkbox"
                name="remember"
                class="h-4 w-4 rounded border-gray-300 accent-[#1E5BB3]"
              />
              Remember me
            </label>
            <a href="#" class="text-[#1E5BB3] hover:underline"
              >Forgot password?</a
            >
          </div>

          <button
            type="submit"
            class="w-full rounded-md bg-[#1E5BB3] px-4 py-2.5 text-sm font-medium text-white duration-200 hover:bg-[#174a92]"
          >
            Log in
          </button>
        </form>

        <p class="mt-5 text-center text-sm text-gray-700">
          New to JobOps?
          <a
            href="register.html"
            class="font-medium text-[#1E5BB3] hover:underline"
            >Create an account</a
          >
        </p>
      </section>
    </main>

    <footer class="mt-auto border-t border-gray-200 bg-white">
      <div
        class="mx-auto flex max-w-6xl items-center justify-between gap-6 px-6 py-6"
      >
        <nav class="flex items-center gap-1 text-sm font-medium text-gray-600">
          <a
            href="#"
            class="rounded-lg px-3 py-2 transition-colors duration-200 hover:bg-gray-100 hover:text-[#1E5BB3]"
            >About</a
          >
          <a
            href="#"
            class="rounded-lg px-3 py-2 transition-colors duration-200 hover:bg-gray-100 hover:text-[#1E5BB3]"
            >Contact Us</a
          >
          <a
            href="#"
            class="rounded-lg px-3 py-2 transition-colors duration-200 hover:bg-gray-100 hover:text-[#1E5BB3]"
            >Partnerships</a
          >
          <a
            href="privacy.html"
            class="rounded-lg px-3 py-2 transition-colors duration-200 hover:bg-gray-100 hover:text-[#1E5BB3]"
            >Privacy Policy</a
          >
          <a
            href="terms.html"
            class="rounded-lg px-3 py-2 transition-colors duration-200 hover:bg-gray-100 hover:text-[#1E5BB3]"
            >Terms of Service</a
          >
        </nav>

        <div class="flex items-center gap-2">
          <a
            href="#"
            title="GitHub"
            aria-label="GitHub"
            class="rounded-md border border-gray-300 p-2 transition-colors duration-200 hover:bg-gray-100"
          >
            <img
              src="../assets/github_light.svg"
              alt="GitHub"
              class="block h-5"
            />
          </a>
          <a
            href="#"
            title="Facebook"
            aria-label="Facebook"
            class="rounded-md border border-gray-300 p-2 transition-colors duration-200 hover:bg-gray-100"
          >
            <img
              src="../assets/facebook-icon.svg"
              alt="Facebook"
              class="block h-5"
            />
          </a>
          <a
            href="#"
            title="LinkedIn"
            aria-label="LinkedIn"
            class="rounded-md border border-gray-300 p-2 transition-colors duration-200 hover:bg-gray-100"
          >
            <img
              src="../assets/linkedin.svg"
              alt="LinkedIn"
              class="block h-5"
            />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
