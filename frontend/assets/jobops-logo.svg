<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 112" width="400" height="112" role="img" aria-label="JobOps logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(8 8)">
    <rect width="96" height="96" rx="24" fill="url(#bg)"/>
    <!-- briefcase handle -->
    <path d="M37 38v-4a5 5 0 0 1 5-5h12a5 5 0 0 1 5 5v4" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- briefcase body -->
    <rect x="22" y="38" width="52" height="36" rx="8" fill="#fff"/>
    <!-- checkmark -->
    <path d="M36 56l9 9 16-17" fill="none" stroke="#4F46E5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="124" y="72" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" letter-spacing="-1.5">
    <tspan font-weight="800" fill="#0F172A">Job</tspan><tspan font-weight="800" fill="#4F46E5">Ops</tspan>
  </text>
</svg>
